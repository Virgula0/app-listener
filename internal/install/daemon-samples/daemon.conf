# app-listener daemon configuration
#
# Each [watch <dir>] section protects one directory (or file) with the
# guard's eBPF LSM engine in whitelist mode, recursive by default: only
# the binaries listed below may access it; everything else is denied
# (EPERM). Tilde is NOT expanded -- use absolute paths.
#
# Identity is verified by inode, not by name: renaming a binary to "ssh"
# does NOT grant it access.
#
# Symlinked binaries (e.g. /usr/bin/gcloud -> /opt/google-cloud-cli/bin/
# gcloud) are resolved to their real path at load time, so either the
# symlink or the target may be listed; events are attributed to the real
# binary either way.
#
# Quoting paths:
#   Every path (a [watch <path>] header, a `watch: <path>` directive, a
#   `path = <dir>` placeholder, or a whitelisted binary) may be wrapped in
#   double quotes, e.g. "/home/alice/Steam/steamapps/common/Proton - Experimental/files/bin/wineserver".
#   Quoting is required for a path containing spaces (or anything else that
#   looks like whitespace) so it is not confused with the event-type list
#   that may follow a binary path on the same line; a path with no such
#   characters may be written bare, as in the rest of this file. The
#   installer always quotes the paths it generates.
#
# Watch targets:
#   A section may watch a DIRECTORY (the classic case, guarded recursively)
#   or a SINGLE regular file carrying its own fscrypt policy. Symbolic
#   links and hardlinked files (more than one hard link) are refused at
#   load time: guard identity is inode based, so an aliasing link would
#   implicitly cover another path to the same inode. Special files
#   (FIFOs, sockets, devices) cannot be watched either.
#
# Encryption (fscrypt):
#   Resources are assumed to be encrypted with fscrypt unless you write
#   "need_encryption: false" inside the section. Encrypted resources are
#   unlocked at startup and locked again on shutdown while the guards
#   remain attached, so there is never an unprotected window. Single files
#   use the same fscrypt machinery (one policy per file, wrapped by the
#   same master key), so `fscrypt status <file>` and the standard CLI keep
#   working on them.
#
#   If a resource marked need_encryption: true carries no fscrypt policy,
#   the daemon refuses to start. Run the fscrypt migration (setup,
#   raw-key encryption with the master key in /etc/app-listener/fscrypt.key)
#   beforehand, or set need_encryption: false for that resource.
#
# Event restrictions (optional, blocking semantics):
#   A binary line may list the events that binary is allowed to perform,
#   e.g. "/usr/bin/ssh READ,WRITE". Unlisted events are denied for that
#   binary. Listing READ, WRITE or MMAP implicitly allows OPEN (a binary
#   must open a file before reading it). A bare path (like the old
#   ssh-guard.conf format) means every event is allowed.
#
#   Valid events: OPEN, READ, WRITE, DELETE, RENAME, SYMLINK, HARDLINK,
#   MKDIR, MMAP, ATTR, STAT, MKNOD (default: all).
#
# Library trust — [libraries "<name>"] blocks:
#   A whitelisted binary may only exec-map libraries the daemon trusts;
#   loading anything else is denied (this is what defeats LD_PRELOAD and
#   library-injection against a whitelisted binary). Four things are
#   trusted, and the first three need no configuration:
#
#     1. Root-owned system libraries -- any .so owned by root, not
#        world-writable, in a directory that is likewise root-owned. This
#        covers /usr/lib, /opt, ... automatically and survives package
#        upgrades, so there is deliberately NO list of system directories
#        to maintain here.
#     2. Anything inside a guarded tree -- if only whitelisted binaries can
#        write a directory, its libraries cannot have been planted.
#     3. Code a whitelisted process generated itself -- a GPU driver's JIT
#        output (memfd, O_TMPFILE, mkstemp) created by that very process
#        image and never written by anything else.
#     4. Whatever you declare in a [libraries] block.
#
#   Library trust is DAEMON-WIDE: every whitelisted binary of every section
#   may load every trusted library. That is why these directives live in
#   their own block, declared once per application after the watch
#   sections, instead of under one watch path they are not scoped to.
#
#   [libraries "Steam (alice)"]
#   allow_lib /home/alice/.local/share/Steam/plugin.so
#   lib_dir /home/alice/.local/share/Steam/steamrt64
#   lib_binary /home/alice/.local/share/Steam/ubuntu12_32/steam
#
#   allow_lib <path>
#     Trusts ONE library file: for a user-writable library at a FIXED path
#     that the application dlopen()s (a plugin, a bundled runtime). The
#     file is also write-protected: no non-whitelisted process may replace
#     it. The daemon already resolves each binary's static ELF dependency
#     closure (DT_NEEDED + interpreter) by itself, so only dynamically
#     loaded extras need listing.
#
#   lib_dir <path>
#     Guards a whole library DIRECTORY (recursively) in read-only mode:
#     every process may still READ it -- so unrelated programs keep loading
#     the same libraries -- while every WRITE, rename, delete or truncate
#     is restricted to the block's lib_binary entries. That write monopoly
#     is what makes everything inside safe to load. Use it when the files
#     cannot be listed: Steam's pressure-vessel runtimes assemble a
#     container /usr under a random var/tmp-XXXXXX name at every launch.
#     Guarding the stable PARENT covers every future random child. A
#     lib_dir is never encrypted -- it holds code, not secrets; a missing
#     directory is warned about and ignored.
#
#   lib_binary <path>
#     Allows ONE binary to write this block's lib_dir trees -- and nothing
#     else: not another block's lib_dirs, and not any protected watch
#     section. This is the one thing a block scopes, and the reason there
#     is one block per application rather than a single global one: one
#     application's updater can never write another's runtime tree. Name
#     the application's own maintenance tools here (its self-updater,
#     Steam's pressure-vessel helpers). Event restrictions are rejected: a
#     lib_dir is guarded read-only, which carries no per-binary mask.
#
#   The block name is a label (the installer finds a block again by it).
#   Older configs nest these directives inside a [watch] section; that form
#   is still accepted, and there a lib_dir is also writable by the
#   section's unrestricted whitelist entries.
#
# chattr/exclude_chattr are NOT supported: the LSM engine provides the
# same granularity, so immutable flags and their exclusions are gone.
#
# Reloading (SIGHUP):
#   Send SIGHUP to the daemon (systemctl reload app-listener-daemon, or
#   kill -HUP <pid>) to re-read this file and recompute every binary's
#   identity by inode. After a package upgrade replaced a whitelisted
#   binary, reload restores access for the new binary immediately. The
#   new guards attach before the old ones detach, so protection is never
#   dropped; a malformed config keeps the previous one running.

[watch /home/alice/.ssh]

# OpenSSH client suite -- the complete, minimal whitelist.
# sshd reads authorized_keys to accept public-key logins (READ only):
# OpenSSH >= 9.8 splits sshd into a dispatcher plus modular helpers; the
# processes that actually open authorized_keys are sshd-auth and
# sshd-session (Ubuntu/Debian: /usr/lib/openssh, Arch: /usr/lib/ssh).
/usr/bin/ssh READ,WRITE,DELETE,RENAME,HARDLINK
/usr/bin/sshd READ
/usr/sbin/sshd READ
/usr/lib/openssh/sshd-auth READ
/usr/lib/ssh/sshd-auth READ
/usr/lib/openssh/sshd-session READ
/usr/lib/ssh/sshd-session READ
/usr/lib/openssh/sftp-server READ
/usr/lib/ssh/sftp-server READ
/usr/bin/ssh-agent
/usr/bin/ssh-keygen
/usr/bin/ssh-add
/usr/bin/scp
/usr/bin/sftp

need_encryption: true
# need_encryption just inserted as an example of usage

# FIDO/hardware key helpers (optional -- e.g. YubiKey): the ssh-sk-helper
# reads security-key material that may live in .ssh (READ only), the other
# helpers never touch .ssh.
/usr/lib/openssh/ssh-sk-helper READ
/usr/lib/ssh/ssh-sk-helper READ
/usr/lib/openssh/ssh-pkcs11-helper
/usr/lib/ssh/ssh-pkcs11-helper
/usr/lib/openssh/ssh-keysign
/usr/lib/ssh/ssh-keysign

[watch /root/.ssh]

# OpenSSH client suite -- the complete, minimal whitelist
/usr/bin/ssh READ,WRITE,DELETE,RENAME,HARDLINK
/usr/bin/sshd READ
/usr/sbin/sshd READ
/usr/lib/openssh/sshd-auth READ
/usr/lib/ssh/sshd-auth READ
/usr/lib/openssh/sshd-session READ
/usr/lib/ssh/sshd-session READ
/usr/lib/openssh/sftp-server READ
/usr/lib/ssh/sftp-server READ
/usr/bin/ssh-agent
/usr/bin/ssh-keygen
/usr/bin/ssh-add
/usr/bin/scp
/usr/bin/sftp

[watch /etc/wireguard]

/usr/bin/nmcli
