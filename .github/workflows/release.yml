name: Release

# Every push to main publishes a PRE-RELEASE: default + GUI linux/amd64
# binaries (version = the pre-YYYYMMDD-sha tag), signed checksums, and a
# generated changelog. The release title is "<constants.Version> · <tag>"
# so the pre-releases leading to a given vX.Y.Z are easy to spot.
# Promoting to a stable vX.Y.Z is promote-release.yml.

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pre-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.m.outputs.tag }}
      title: ${{ steps.m.outputs.title }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute pre-release tag and title
        id: m
        run: |
          set -euo pipefail
          tag="pre-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          target="$(sed -n 's/^var Version = "\(.*\)"$/\1/p' internal/constants/constants.go | head -n1)"
          if [ -n "$target" ]; then
            title="$target · $tag"
          else
            title="Pre-release $tag"
          fi
          echo "tag=$tag"     >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    uses: ./.github/workflows/_build-release.yml
    with:
      version: ${{ needs.meta.outputs.tag }}
      ref: ${{ github.sha }}
    secrets:
      signing-key: ${{ secrets.RELEASE_SIGNING_KEY }}

  release:
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist

      - name: Verify the default binary assets are present
        run: |
          set -euo pipefail
          for f in app-listener app-listener.sha256 app-listener.sha256.sig; do
            test -f "dist/$f"
          done
          ls -la dist

      - name: Create pre-release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.title }}
          commit: ${{ github.sha }}
          prerelease: true
          generateReleaseNotes: true
          # Missing GUI assets are a warning, not a failure.
          artifacts: >-
            dist/app-listener,dist/app-listener.sha256,dist/app-listener.sha256.sig,dist/app-listener-gui,dist/app-listener-gui.sha256,dist/app-listener-gui.sha256.sig
