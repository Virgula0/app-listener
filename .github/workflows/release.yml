name: Release

# Runs on commits landing on main (which includes merged pull requests).
# Builds the Linux binary (with the pre-release tag embedded as its
# version), computes and signs its sha256 checksum, and creates a
# pre-release whose changelog is the commits since the previous tag.
# The updater (`app-listener update`) verifies the signed checksum before
# installing.

on:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: read

concurrency:
  group: pre-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute pre-release tag
        id: tag
        run: echo "tag=pre-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Cache and install apt packages
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          # make build-linux compiles the fyne GUI, which needs CGO,
          # OpenGL and X11 development headers.
          packages: gcc libc6-dev make libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
          version: 1.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build Linux binary
        run: make build-linux VERSION=${{ steps.tag.outputs.tag }}

      - name: Compute checksum
        run: sha256sum build/linux/app-listener > build/linux/app-listener.sha256

      - name: Sign checksum
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY secret is not set: the pre-release would be rejected by app-listener update"
            exit 1
          fi
          printf '%s\n' "$SIGNING_KEY" > /tmp/app-listener-signing-key.pem
          chmod 600 /tmp/app-listener-signing-key.pem
          openssl pkeyutl -sign -rawin \
            -inkey /tmp/app-listener-signing-key.pem \
            -in build/linux/app-listener.sha256 \
            -out build/linux/app-listener.sha256.sig
          rm -f /tmp/app-listener-signing-key.pem

      - name: Verify checksum signature
        run: |
          openssl pkeyutl -verify -rawin \
            -pubin -inkey certificates/app-listener-release.pub \
            -in build/linux/app-listener.sha256 \
            -sigfile build/linux/app-listener.sha256.sig

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-listener
          path: |
            build/linux/app-listener
            build/linux/app-listener.sha256
            build/linux/app-listener.sha256.sig
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # Creating the tag and the pre-release requires contents: write for
    # the GITHUB_TOKEN; everything else stays read.
    permissions:
      contents: write
    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-listener

      - name: Create pre-release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ needs.build.outputs.tag }}
          name: Pre-release ${{ needs.build.outputs.tag }}
          commit: ${{ github.sha }}
          prerelease: true
          generateReleaseNotes: true
          artifacts: |
            app-listener/app-listener
            app-listener/app-listener.sha256
            app-listener/app-listener.sha256.sig
