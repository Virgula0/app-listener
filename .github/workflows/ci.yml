name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: read
  checks: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-26.04
    # Lint runs only on non-draft pull requests (and on pushes to main).
    if: github.event.pull_request.draft != true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cache-apt-pkgs runs no apt-get update on GitHub runners: from the image's stale index a
      # superseded .deb 404s, the install fails, and the action still saves an empty cache.
      - name: Refresh apt package lists
        run: sudo apt-get update

      - name: Cache and install apt packages
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          # golangci-lint typechecks the whole module, including the
          # fyne GUI, which needs OpenGL and X11 development headers.
          packages: pkg-config gcc libc6-dev make libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
          version: ubuntu-26.04-3

      # A cache saved from a failed install restores nothing on every later hit: fall back to apt,
      # and bump `version` above so the next run saves a complete cache.
      - name: Check the GUI build headers
        run: |
          set -uo pipefail
          mods="gl x11 xrandr xcursor xinerama xi xxf86vm wayland-client wayland-cursor wayland-egl xkbcommon"
          pkg-config --exists $mods 2>/dev/null && exit 0
          echo "::warning::the apt cache lacks GUI headers: installing them with apt (bump the cache-apt-pkgs version)"
          set -e
          sudo apt-get install -y --no-install-recommends pkg-config gcc libc6-dev make libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
          pkg-config --exists $mods

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # make lint also runs tools/codecheck (own module) and deadcode@DEADCODE_VERSION.
          cache-dependency-path: |
            go.sum
            tools/codecheck/go.sum

      # Generated eBPF bindings are no longer committed (issue #45: a stale
      # object shipped in a release and crashed a newer kernel). Regenerate
      # them inside the pinned builder image against the runner's BTF.
      - name: Regenerate eBPF bindings (pinned builder image)
        run: |
          set -euo pipefail
          test -r /sys/kernel/btf/vmlinux || { echo "::error::runner has no readable BTF"; exit 1; }
          make build-image
          # clang < ~17 emits a guard_path_rename that overflows the verifier's
          # 1M-insn budget on modern kernels (issue #45); the image pins clang 22.
          docker run --rm app-listener-builder:local clang --version
          docker run --rm \
            -v /sys/kernel/btf/vmlinux:/sys/kernel/btf/vmlinux:ro \
            -v "$PWD:/app/app-listener:rw" \
            -e HOME=/tmp -e GOCACHE=/tmp/.gocache -e GOPATH=/tmp/gopath -e GOMODCACHE=/tmp/gopath/pkg/mod \
            -w /app/app-listener \
            app-listener-builder:local \
            make generate

      - name: Install golangci-lint
        run: make install-linter

      - name: Add linter to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: make lint

  test:
    runs-on: ubuntu-26.04
    if: github.event.pull_request.draft != true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cache-apt-pkgs runs no apt-get update on GitHub runners: from the image's stale index a
      # superseded .deb 404s, the install fails, and the action still saves an empty cache.
      - name: Refresh apt package lists
        run: sudo apt-get update

      - name: Cache and install apt packages
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          # CGO is enabled for the fscrypt mlock dependency, so the
          # tests need a C toolchain and libc headers. The fyne GUI
          # needs OpenGL and X11 development headers to typecheck.
          packages: pkg-config gcc libc6-dev make libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
          version: ubuntu-26.04-3

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Generated eBPF bindings are no longer committed (issue #45: a stale
      # object shipped in a release and crashed a newer kernel). Regenerate
      # them inside the pinned builder image against the runner's BTF.
      - name: Regenerate eBPF bindings (pinned builder image)
        run: |
          set -euo pipefail
          test -r /sys/kernel/btf/vmlinux || { echo "::error::runner has no readable BTF"; exit 1; }
          make build-image
          # clang < ~17 emits a guard_path_rename that overflows the verifier's
          # 1M-insn budget on modern kernels (issue #45); the image pins clang 22.
          docker run --rm app-listener-builder:local clang --version
          docker run --rm \
            -v /sys/kernel/btf/vmlinux:/sys/kernel/btf/vmlinux:ro \
            -v "$PWD:/app/app-listener:rw" \
            -e HOME=/tmp -e GOCACHE=/tmp/.gocache -e GOPATH=/tmp/gopath -e GOMODCACHE=/tmp/gopath/pkg/mod \
            -w /app/app-listener \
            app-listener-builder:local \
            make generate

      - name: Test
        run: make test