name: Build & sign release assets

# Reusable build core for release.yml and promote-release.yml. Checks out
# `ref`, compiles the linux/amd64 and linux/arm64 binaries with `version`
# embedded, then sha256s and Ed25519-signs each. Each arch builds natively on
# its own runner: the eBPF is compiled against that runner kernel's BTF and
# register layout, so it cannot be cross-built. Asset names (install.sh and
# `app-listener update` pick theirs by exact name):
#   amd64: app-listener, app-listener-gui              (unsuffixed: older
#          binaries' `update` looks these names up)
#   arm64: app-listener-arm64, app-listener-gui-arm64
# The GUI builds (make build-linux GUI=1) are best-effort and for manual
# download only. Each arch uploads a `release-assets-<arch>` artifact.

on:
  workflow_call:
    inputs:
      version:
        description: Version string to embed via -ldflags (vX.Y.Z or pre-YYYYMMDD-sha).
        required: true
        type: string
      ref:
        description: Commit, tag or branch to build from.
        required: true
        type: string
    secrets:
      signing-key:
        description: Ed25519 PEM private key (RELEASE_SIGNING_KEY).
        required: true

permissions:
  contents: read

jobs:
  build:
    # Every leg must pass: the publishing jobs `needs:` this one, so one failed
    # arch publishes no release at all rather than a half-populated one.
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
            suffix: ""
            elf_machine: X86-64
          - arch: arm64
            runner: ubuntu-26.04-arm
            suffix: -arm64
            elf_machine: AArch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the ref being released
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Cache and install apt packages
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          # cgo (fscrypt mlock) needs a C toolchain; the GUI needs the fyne
          # OpenGL/X11/Wayland headers.
          packages: pkg-config gcc libc6-dev make libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
          version: ubuntu-26.04-2

      # The cache holds only what apt newly unpacked on the run that saved its key, and the key
      # ignores the runner image: a newer image can leave headers out of a restored cache. Fall back
      # to apt, and bump `version` above so the next run saves a complete cache.
      - name: Check the GUI build headers
        run: |
          set -uo pipefail
          mods="gl x11 xrandr xcursor xinerama xi xxf86vm wayland-client wayland-cursor wayland-egl xkbcommon"
          pkg-config --exists $mods 2>/dev/null && exit 0
          echo "::warning::the apt cache lacks GUI headers: installing them with apt (bump the cache-apt-pkgs version)"
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config gcc libc6-dev make libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
          pkg-config --exists $mods

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The eBPF objects MUST be regenerated here, never taken from git: an
      # object compiled against a different kernel's BTF than the release
      # target can hit the verifier's complexity limit — or, worse, verify
      # wrong and corrupt kernel memory at runtime (issue #45). Generate them
      # inside the pinned builder image (clang 22 + bpftool) against
      # the runner's BTF; CO-RE relocates field offsets at load time, and
      # `daemon --check` fails the install closed on any kernel whose verifier
      # still rejects a program.
      - name: Regenerate eBPF bindings (pinned builder image)
        run: |
          set -euo pipefail
          test -r /sys/kernel/btf/vmlinux || { echo "::error::runner has no readable BTF — cannot generate CO-RE objects"; exit 1; }
          make build-image
          # Provenance: record the exact BPF compiler. clang < ~17 emits a
          # guard_path_rename that overflows the verifier's 1M-insn budget on
          # modern kernels (issue #45); builder.Dockerfile pins clang 22.
          docker run --rm app-listener-builder:local clang --version
          docker run --rm \
            -v /sys/kernel/btf/vmlinux:/sys/kernel/btf/vmlinux:ro \
            -v "$PWD:/app/app-listener:rw" \
            -e HOME=/tmp -e GOCACHE=/tmp/.gocache -e GOPATH=/tmp/gopath -e GOMODCACHE=/tmp/gopath/pkg/mod \
            -w /app/app-listener \
            app-listener-builder:local \
            make generate

      - name: Build default binary
        env:
          VERSION: ${{ inputs.version }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          mkdir -p dist
          make build-linux VERSION="$VERSION"
          mv build/linux/app-listener "dist/app-listener$SUFFIX"

      - name: Build GUI binary (best-effort)
        env:
          VERSION: ${{ inputs.version }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          if make build-linux GUI=1 VERSION="$VERSION"; then
            mv build/linux/app-listener "dist/app-listener-gui$SUFFIX"
          else
            echo "::warning title=GUI build failed::app-listener-gui$SUFFIX is omitted from this release"
          fi

      - name: Sanity-check the default binary
        env:
          VERSION: ${{ inputs.version }}
          SUFFIX: ${{ matrix.suffix }}
          ELF_MACHINE: ${{ matrix.elf_machine }}
        run: |
          set -euo pipefail
          bin="dist/app-listener$SUFFIX"
          chmod +x "$bin"
          readelf -h "$bin" | grep -E '^ *Machine:' | grep -qF -- "$ELF_MACHINE" \
            || { echo "::error::$bin is not a $ELF_MACHINE ELF: $(readelf -h "$bin" | grep Machine)"; exit 1; }
          got="$("$bin" --version 2>&1)"
          printf '%s\n' "$got"
          printf '%s' "$got" | grep -qF -- "$VERSION" \
            || { echo "::error::default binary reports '$got', expected '$VERSION'"; exit 1; }

      # Verifies the exact objects being shipped (rebuilt here, not the PR's). GitHub's runners build
      # BPF-LSM in without activating it, hence --verifier-only (see verifier.yml).
      - name: Guard eBPF loads into the runner kernel's verifier
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: sudo "dist/app-listener$SUFFIX" daemon --check --verifier-only

      - name: Checksum and Ed25519-sign the binaries
        env:
          SIGNING_KEY: ${{ secrets.signing-key }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "::error::RELEASE_SIGNING_KEY is not set"
            exit 1
          fi
          key="$RUNNER_TEMP/app-listener-signing-key.pem"
          printf '%s\n' "$SIGNING_KEY" > "$key"
          chmod 600 "$key"
          # sha256sum records the asset name; `update` checks it against the name it fetched.
          for b in "app-listener$SUFFIX" "app-listener-gui$SUFFIX"; do
            [ -f "dist/$b" ] || continue
            ( cd dist && sha256sum "$b" > "$b.sha256" )
            openssl pkeyutl -sign -rawin -inkey "$key" \
              -in "dist/$b.sha256" -out "dist/$b.sha256.sig"
            openssl pkeyutl -verify -rawin -pubin \
              -inkey certificates/app-listener-release.pub \
              -in "dist/$b.sha256" -sigfile "dist/$b.sha256.sig"
          done
          rm -f "$key"
          ls -la dist

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ matrix.arch }}
          path: dist
          if-no-files-found: error
          retention-days: 1
