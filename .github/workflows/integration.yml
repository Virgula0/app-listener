name: Integration tests

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: read
  checks: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    # Runs only on non-draft pull requests (and on pushes to main).
    if: github.event.pull_request.draft != true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache and install apt packages
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          # The exploit suite is built with gcc and the daemon links
          # fscrypt with cgo (mlock), which needs libc headers. The
          # fyne GUI needs OpenGL and X11 development headers to build.
          packages: gcc libc6-dev make libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
          version: 1.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Host environment diagnostic
        run: |
          echo "== uname =="; uname -r
          echo "== active LSMs =="; cat /sys/kernel/security/lsm 2>&1 || true
          echo "== btf =="; ls -l /sys/kernel/btf/vmlinux 2>&1 || true
          echo "== unprivileged_bpf_disabled =="; sysctl -n kernel.unprivileged_bpf_disabled 2>&1 || true
          echo "== docker =="; docker info --format '{{.Driver}} {{.ServerVersion}}' 2>&1
          echo "== CapEff =="; grep CapEff /proc/self/status
          echo "== kernel config =="; grep -E "CONFIG_BPF_LSM=|CONFIG_BPF=|CONFIG_LSM=" /boot/config-$(uname -r) 2>/dev/null || zcat /proc/config.gz 2>/dev/null | grep -E "CONFIG_BPF_LSM|CONFIG_BPF=|CONFIG_LSM=" || echo "<no kernel config readable>"

      - name: Guard LSM diagnostic probe (single container)
        run: go test ./integrationtests/ -run 'TestIntegrationSuite/TestDiag_GuardLSM' -v --count=1 -timeout 5m

      - name: Integration tests
        run: make test-integration